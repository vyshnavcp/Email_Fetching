{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Inbox</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  
 
 
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --ink: #0f0e0b;
      --paper: #f7f5f0;
      --cream: #edeae2;
      --gold: #c9a84c;
      --gold-light: #f0dfa0;
      --muted: #7a7669;
      --card: #fffefb;
      --border: #dedad0;
      --red: #c0392b;
      --red-light: #fde8e8;
      --green: #15803d;
      --green-light: #dcfce7;
      --green-border: #86efac;
      --blue: #1d4ed8;
      --blue-light: #dbeafe;
      --blue-border: #93c5fd;
      --sidebar-w: 240px;
    }
    
 
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      min-height: 100vh;
      color: var(--ink);
      display: flex;
      overflow-x: hidden;
    }
 
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }
 
    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--ink);
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
      transition: width 0.25s ease;
      overflow: hidden;
    }
 
    .sidebar.collapsed { width: 60px; }
 
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 22px 18px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      min-width: var(--sidebar-w);
    }
 
    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--ink);
      font-size: 16px;
    }
 
    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--gold-light);
      white-space: nowrap;
      opacity: 1;
      transition: opacity 0.2s;
    }
 
    .sidebar.collapsed .logo-text { opacity: 0; }
 
    .sidebar-toggle {
      position: absolute;
      top: 22px;
      right: 0px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold);
      border: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      font-size: 11px;
      transition: transform 0.25s;
      z-index: 10;
    }
 
    .sidebar.collapsed .sidebar-toggle { transform: rotate(180deg); }
 
    /* Nav */
    .sidebar-nav {
      flex: 1;
      padding: 16px 0;
      overflow-y: auto;
      overflow-x: hidden;
    }
 
    .nav-section-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      padding: 14px 18px 6px;
      white-space: nowrap;
      overflow: hidden;
      transition: opacity 0.2s;
    }
 
    .sidebar.collapsed .nav-section-label { opacity: 0; }
 
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 18px;
      cursor: pointer;
      border-radius: 0;
      color: rgba(255,255,255,0.55);
      font-size: 13.5px;
      font-weight: 400;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      position: relative;
    }
 
    .nav-item i { font-size: 17px; flex-shrink: 0; }
 
    .nav-item:hover {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.9);
    }
 
    .nav-item.active {
      background: rgba(201,168,76,0.12);
      color: var(--gold-light);
    }
 
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--gold);
    }
 
    /* Dropdown nav item */
    .nav-group { width: 100%; }
 
    .nav-group-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 18px;
      cursor: pointer;
      color: rgba(255,255,255,0.55);
      font-size: 13.5px;
      font-weight: 400;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      user-select: none;
    }
 
    .nav-group-toggle:hover {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.9);
    }
 
    .nav-group-toggle i.group-icon { font-size: 17px; flex-shrink: 0; }
 
    .nav-group-label { flex: 1; }
 
    .nav-group-arrow {
      font-size: 12px;
      transition: transform 0.22s;
      margin-left: auto;
      flex-shrink: 0;
    }
 
    .sidebar.collapsed .nav-group-label,
    .sidebar.collapsed .nav-group-arrow { display: none; }
 
    .nav-group.open .nav-group-arrow { transform: rotate(90deg); }
 
    .nav-group-children {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.25s ease;
    }
 
    .nav-group.open .nav-group-children { max-height: 200px; }
    .sidebar.collapsed .nav-group-children { max-height: 0; }
 
    .nav-child {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px 7px 44px;
      color: rgba(255,255,255,0.42);
      font-size: 12.5px;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
 
    .nav-child i { font-size: 14px; }
 
    .nav-child:hover {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.8);
    }
 
    /* Sidebar bottom */
    .sidebar-bottom {
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 14px;
    }
 
    .logout-side {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      text-decoration: none;
      transition: all 0.18s;
      white-space: nowrap;
    }
 
    .logout-side i { font-size: 17px; flex-shrink: 0; }
    .logout-side:hover { background: rgba(192,57,43,0.18); color: #f5bebe; }
 
    .sidebar.collapsed .logout-side span { display: none; }
 
    /* ── Main content ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-height: 100vh;
      transition: margin-left 0.25s ease;
      position: relative;
      z-index: 1;
    }
 
    .main.sidebar-collapsed { margin-left: 60px; }
 
    .shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
 
    /* ── Header ── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
 
    .header-left { display: flex; flex-direction: column; gap: 4px; }
 
    .eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
    }
 
    .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 12px;
    }
 
    .badge {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--gold-light);
      color: #7a5c10;
      border: 1px solid #e0c97a;
      vertical-align: middle;
      position: relative;
      top: -4px;
    }
 
    .fetch-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--ink);
      color: var(--gold-light);
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
 
    .fetch-btn:hover  { background: #2a2820; }
    .fetch-btn:active { transform: scale(0.97); }
    .fetch-btn i { font-size: 15px; transition: transform 0.3s; }
    .fetch-btn.loading i { animation: spin 0.8s linear infinite; }
 
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
 
    /* ── Error ── */
    .error-msg {
      background: var(--red-light);
      border: 1px solid #f5bebe;
      color: var(--red);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
 
    /* ── Idle / Empty ── */
    .idle-state, .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      animation: fadeUp 0.4s ease both;
    }
 
    .idle-state i, .empty i {
      font-size: 42px;
      display: block;
      margin-bottom: 14px;
      opacity: 0.25;
    }
 
    .idle-state p, .empty p {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      opacity: 0.45;
    }
 
    /* ── Email list ── */
    .email-list { display: flex; flex-direction: column; gap: 2px; }
 
    .email-link { text-decoration: none; color: inherit; display: block; }
 
    .email-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      display: flex;
      gap: 16px;
      transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
      position: relative;
      animation: fadeUp 0.4s ease both;
    }
 
    .email-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 14px;
      bottom: 14px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--gold);
      opacity: 0;
      transition: opacity 0.2s;
    }
 
    .email-link:hover .email-card {
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      transform: translateY(-1px);
      border-color: #ccc9be;
    }
 
    .email-link:hover .email-card::before { opacity: 1; }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--cream);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--muted);
      flex-shrink: 0;
    }
 
    .email-body { flex: 1; min-width: 0; }
 
    .email-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
 
    .sender-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
      flex-wrap: wrap;
    }
 
    .email-from {
      font-weight: 500;
      font-size: 14px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
 
    .ticket-badge {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--cream);
      color: var(--muted);
      border: 1px solid var(--border);
      white-space: nowrap;
      flex-shrink: 0;
    }
 
    .status-pill {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 20px;
      flex-shrink: 0;
    }
 
    .status-unassigned { background: var(--blue-light);  color: var(--blue);  border: 1px solid var(--blue-border); }
    .status-assigned   { background: var(--gold-light);  color: #7a5c10;      border: 1px solid #e0c97a; }
    .status-closed     { background: var(--green-light); color: var(--green); border: 1px solid var(--green-border); }
 
    .email-date {
      font-size: 11px;
      color: var(--muted);
      font-weight: 300;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }
 
    .email-subject {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      font-size: 15px;
      margin: 5px 0 3px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
 
    .email-preview {
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 300;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.5;
      margin-bottom: 8px;
    }
 
    .assigned-row { display: flex; align-items: center; gap: 6px; }
 
    .assigned-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink);
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 9px 2px 4px;
    }
 
    .assigned-chip-avatar {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: var(--gold-light);
      border: 1px solid #e0c97a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 700;
      color: #7a5c10;
      flex-shrink: 0;
    }
 
    .unassigned-chip {
      font-size: 11px;
      color: var(--muted);
      font-weight: 300;
      font-style: italic;
    }
 
  </style>
  {% block css %}
  {% endblock %}
</head>

 
<body>
 
  <!-- ── Sidebar ── -->
 {% include 'components/sidebar.html' %}
 
  <!-- ── Main ── -->
  <main class="main" id="main">
   {% block content %}{% endblock content %}
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
 {% block js %}{% endblock %}
  <script>
    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const main = document.getElementById('main');
      sb.classList.toggle('collapsed');
      main.classList.toggle('sidebar-collapsed');
      localStorage.setItem('sidebar-collapsed', sb.classList.contains('collapsed'));
    }
 
    function toggleGroup(id) {
      const group = document.getElementById(id);
      // Don't open dropdowns when sidebar is collapsed
      if (document.getElementById('sidebar').classList.contains('collapsed')) return;
      group.classList.toggle('open');
    }
 
    function submitFetch(btn) {
      btn.classList.add('loading');
      btn.disabled = true;
      document.getElementById('fetch-form').submit();
    }
 
    // Restore sidebar state
    if (localStorage.getItem('sidebar-collapsed') === 'true') {
      document.getElementById('sidebar').classList.add('collapsed');
      document.getElementById('main').classList.add('sidebar-collapsed');
    }
  </script>
 
</body>
</html>

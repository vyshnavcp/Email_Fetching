<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Send Email</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*,
*::before,
*::after{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --ink:#111111;
    --paper:#f5f3ee;
    --card:#ffffff;
    --gold:#caa64d;
    --gold-light:#e8d9a8;
    --border:#ddd8cd;
    --muted:#6f6b61;
}

body{
    font-family:'DM Sans',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:40px 20px;
}

.shell{
    max-width:900px;
    margin:auto;
}

.title{
    font-family:'Playfair Display',serif;
    font-size:42px;
    margin-bottom:25px;
}

.form-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.04);
}

.field{
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:var(--muted);
}

input,
textarea{
    width:100%;
    padding:14px;
    border:1px solid var(--border);
    border-radius:14px;
    font-size:14px;
    outline:none;
    transition:0.3s;
    background:#fff;
}

input:focus,
textarea:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(202,166,77,0.15);
}

textarea{
    min-height:220px;
    resize:vertical;
}

.drop-zone{
    border:2px dashed var(--gold);
    background:#faf7ef;
    border-radius:18px;
    padding:45px 25px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

.drop-zone:hover{
    background:#fdf8e9;
}

.drop-zone.dragover{
    background:#f8edc8;
}

.drop-zone i{
    font-size:48px;
    color:var(--gold);
    margin-bottom:12px;
}

.drop-zone p{
    margin-bottom:8px;
}

.note{
    color:var(--muted);
    font-size:13px;
}

.file-list{
    margin-top:18px;
}

.file-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:12px;
    background:white;
    margin-bottom:10px;
}

.file-item-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.file-item i{
    font-size:20px;
    color:var(--gold);
}

.send-btn{
    border:none;
    background:var(--ink);
    color:var(--gold-light);
    padding:14px 24px;
    border-radius:14px;
    font-size:15px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:0.3s;
}

.send-btn:hover{
    background:#232323;
    transform:translateY(-1px);
}

.success{
    background:#e7f8eb;
    color:#1c7a36;
    border:1px solid #b8ebc4;
    padding:14px;
    border-radius:12px;
    margin-bottom:20px;
}

@media(max-width:768px){

    .title{
        font-size:32px;
    }

    .form-box{
        padding:20px;
    }

}

</style>

</head>

<body>

<div class="shell">

    <h1 class="title">Send Email</h1>

    {% if messages %}

        {% for message in messages %}

            <div class="success">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="form-box">

            <!-- TO -->
            <div class="field">

                <label>To</label>

                <input
                    type="email"
                    name="to_email"
                    placeholder="client@gmail.com"
                    required
                >

            </div>

            <!-- CC -->
            <div class="field">

                <label>CC</label>

                <input
                    type="text"
                    name="cc_email"
                    placeholder="manager@gmail.com, team@gmail.com"
                >

            </div>

            <!-- BCC -->
            <div class="field">

                <label>BCC</label>

                <input
                    type="text"
                    name="bcc_email"
                    placeholder="admin@gmail.com"
                >

            </div>

            <!-- SUBJECT -->
            <div class="field">

                <label>Subject</label>

                <input
                    type="text"
                    name="subject"
                    placeholder="Enter email subject"
                    required
                >

            </div>

            <!-- BODY -->
            <div class="field">

                <label>Message</label>

                <textarea
                    name="body"
                    placeholder="Write your message..."
                    required
                ></textarea>

            </div>

            <!-- ATTACHMENTS -->
            <div class="field">

                <label>Attachments</label>

                <div class="drop-zone" id="drop-zone">

                    <i class="ti ti-upload"></i>

                    <p><strong>Drag & Drop files here</strong></p>

                    <p class="note">
                        ZIP, PDF, DOCX, JPG, PNG supported
                    </p>

                    <input
                        type="file"
                        id="file-input"
                        name="attachments"
                        multiple
                        hidden
                    >

                </div>

                <div class="file-list" id="file-list"></div>

            </div>

            <!-- BUTTON -->
            <button type="submit" class="send-btn">

                <i class="ti ti-send"></i>

                Send Email

            </button>

        </div>

    </form>

</div>

<script>

const dropZone = document.getElementById("drop-zone");

const fileInput = document.getElementById("file-input");

const fileList = document.getElementById("file-list");


// CLICK OPEN
dropZone.addEventListener("click", () => {

    fileInput.click();

});


// DRAG OVER
dropZone.addEventListener("dragover", (e) => {

    e.preventDefault();

    dropZone.classList.add("dragover");

});


// DRAG LEAVE
dropZone.addEventListener("dragleave", () => {

    dropZone.classList.remove("dragover");

});


// DROP FILE
dropZone.addEventListener("drop", (e) => {

    e.preventDefault();

    dropZone.classList.remove("dragover");

    fileInput.files = e.dataTransfer.files;

    showFiles();

});


// INPUT CHANGE
fileInput.addEventListener("change", showFiles);


// SHOW FILES
function showFiles(){

    fileList.innerHTML = "";

    Array.from(fileInput.files).forEach(file => {

        const div = document.createElement("div");

        div.classList.add("file-item");

        div.innerHTML = `

            <div class="file-item-left">

                <i class="ti ti-paperclip"></i>

                <span>${file.name}</span>

            </div>

            <small>
                ${(file.size / 1024).toFixed(1)} KB
            </small>

        `;

        fileList.appendChild(div);

    });

}

</script>

</body>
</html>

{% extends "main.html" %}
{% block title %}Tickets List{% endblock %}
{% load static %}

{% block css %}
<style>

:root {
  --ink: #0f0e0b;
  --paper: #f7f5f0;
  --cream: #edeae2;
  --gold: #c9a84c;
  --gold-light: #f0dfa0;
  --muted: #7a7669;
  --card: #fffefb;
  --border: #dedad0;
  --red: #c0392b;
  --green: #2e7d32;
  --orange: #ef6c00;
}

.shell {
  max-width: 1400px;
  margin: auto;
  padding: 50px 24px;
  position: relative;
  z-index: 1;
}

.top-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 35px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.eyebrow {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .18em;
  color: var(--gold);
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: 38px;
  font-weight: 700;
}

.top-bar {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 28px;
}

.search-box {
  position: relative;
}

.search-box i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
}

input,
select {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
  outline: none;
  transition: .3s;
  min-width: 180px;
  color: var(--ink);
}

input {
  padding-left: 42px;
}

input:focus,
select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,168,76,.12);
}

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid var(--border);
}

table th {
  background: var(--cream);
  padding: 18px;
  text-align: left;
  font-size: 13px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
}

table td {
  padding: 18px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}

tbody tr {
  transition: background .2s, box-shadow .2s;
  cursor: pointer;
}

tbody tr:hover {
  background: #faf8f3;
  box-shadow: inset 3px 0 0 var(--gold);
}

tbody tr:hover .ticket-no {
  text-decoration: underline;
  text-underline-offset: 3px;
}

tbody tr:active {
  background: var(--cream);
}

.ticket-no {
  font-weight: 700;
  color: var(--gold);
}

.subject {
  font-weight: 500;
}

.staff {
  color: var(--muted);
}

.date {
  color: var(--muted);
  font-size: 13px;
}

.badge {
  padding: 6px 12px;
  border-radius: 20px;
  color: white;
  font-size: 12px;
  font-weight: 500;
}

.assigned   { background: var(--green);  }
.unassigned { background: var(--orange); }
.closed     { background: var(--red);    }

.cc-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.cc-addr {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
}

.cc-empty {
  color: var(--border);
  font-size: 13px;
}

.no-data {
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
}

.no-data i {
  font-size: 42px;
  margin-bottom: 12px;
  display: block;
  opacity: .3;
}

@media (max-width: 900px) {

  .top-header {
    flex-direction: column;
    gap: 18px;
    align-items: flex-start;
  }

  .top-bar {
    flex-direction: column;
  }

  input, select {
    width: 100%;
  }

  table {
    display: block;
    overflow-x: auto;
  }

}
</style>
{% endblock %}


{% block content %}
<div class="shell">

  <div class="top-header">
    <div>
      <div class="eyebrow">Management</div>
      <h1 class="title">All Tickets</h1>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="top-bar">

    <div class="search-box">
      <i class="ti ti-search"></i>
      <input type="text" id="search"
             placeholder="Search Ticket No, Subject, Sender, Staff">
    </div>

    <select id="status">
      <option value="">All Status</option>
      <option value="assigned">Assigned</option>
      <option value="unassigned">Unassigned</option>
      <option value="closed">Closed</option>
    </select>

    <select id="staff">
      <option value="">All Staff</option>
      {% for s in staffs %}
        <option value="{{ s.id }}">{{ s.name }}</option>
      {% endfor %}
    </select>

    <div class="search-box">
      <i class="ti ti-calendar"></i>
      <input type="date" id="from_date">
    </div>

    <div class="search-box">
      <i class="ti ti-calendar"></i>
      <input type="date" id="to_date">
    </div>

  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>Ticket No</th>
        <th>Subject</th>
        <th>Sender</th>
        <th>CC</th>
        <th>Status</th>
        <th>Assigned Staff</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="ticket-body"></tbody>
  </table>

</div>
{% endblock %}


{% block js %}
<script>

  function loadTickets() {

    $.ajax({

      url: "{% url 'filter_tickets' %}",

      data: {
        search:    $("#search").val(),
        status:    $("#status").val(),
        staff:     $("#staff").val(),
        from_date: $("#from_date").val(),
        to_date:   $("#to_date").val(),
      },

      success: function(response) {

        let rows = "";

        if (response.tickets.length > 0) {

          response.tickets.forEach(function(ticket) {

            var detailUrl = "/email/" + ticket.mail_id + "/";

            var ccHtml = ticket.cc && ticket.cc.length
              ? `<div class="cc-list">${ticket.cc.map(addr => `<span class="cc-addr" title="${addr}">${addr}</span>`).join('')}</div>`
              : `<span class="cc-empty">—</span>`;

            rows += `
              <tr onclick="window.location='${detailUrl}'" title="View ticket ${ticket.ticket_number}">
                <td class="ticket-no">${ticket.ticket_number}</td>
                <td class="subject">${ticket.subject}</td>
                <td>${ticket.sender}</td>
                <td>${ccHtml}</td>
                <td><span class="badge ${ticket.status}">${ticket.status}</span></td>
                <td class="staff">${ticket.staff}</td>
                <td class="date">${ticket.date}</td>
              </tr>
            `;

          });

        } else {

          rows = `
            <tr>
              <td colspan="7" class="no-data">
                <i class="ti ti-ticket-off"></i>
                No Tickets Found
              </td>
            </tr>
          `;

        }

        $("#ticket-body").html(rows);

      }

    });

  }

  loadTickets();

  $("#search").keyup(function()     { loadTickets(); });
  $("#status").change(function()    { loadTickets(); });
  $("#staff").change(function()     { loadTickets(); });
  $("#from_date").change(function() { loadTickets(); });
  $("#to_date").change(function()   { loadTickets(); });

</script>
{% endblock %}

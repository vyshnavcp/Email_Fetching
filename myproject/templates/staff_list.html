{% extends "main.html" %}
{% load static %}

{% block title %}Staff List{% endblock %}

{% block css %}

<style>

*,*::before,*::after{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --ink:#0f0e0b;
    --paper:#f7f5f0;
    --cream:#edeae2;
    --gold:#c9a84c;
    --gold-light:#f0dfa0;
    --muted:#7a7669;
    --card:#fffefb;
    --border:#dedad0;
    --red:#c0392b;
    --green:#2e7d32;
}

body{
    font-family:'DM Sans',sans-serif;
    background:var(--paper);
    min-height:100vh;
    color:var(--ink);
    overflow-x:hidden;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events:none;
    opacity:.6;
}

.shell{
    max-width:1300px;
    margin:auto;
    padding:50px 24px;
    position:relative;
    z-index:1;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:35px;
    padding-bottom:20px;
    border-bottom:1px solid var(--border);
}

.eyebrow{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.18em;
    color:var(--gold);
}

.title{
    font-family:'Playfair Display',serif;
    font-size:38px;
    font-weight:700;
}

.add-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--ink);
    color:var(--gold-light);
    padding:10px 18px;
    border-radius:8px;
    text-decoration:none;
    font-size:13px;
    transition:.3s;
    border:none;
    cursor:pointer;
}

.add-btn:hover{
    background:#2a2820;
}

.filter-bar{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:28px;
}

.search-box{
    position:relative;
}

.search-box i{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
}

input,
select{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 16px;
    font-size:14px;
    outline:none;
    transition:.3s;
    min-width:220px;
}

input{
    padding-left:42px;
}

input:focus,
select:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,168,76,.12);
}

.table-wrap{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
}

table{
    width:100%;
    border-collapse:collapse;
}

table th{
    background:var(--cream);
    padding:18px;
    text-align:left;
    font-size:13px;
    color:var(--muted);
    text-transform:uppercase;
}

table td{
    padding:18px;
    border-bottom:1px solid var(--border);
}

tbody tr:hover{
    background:#faf8f3;
}

.staff-box{
    display:flex;
    align-items:center;
    gap:14px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:12px;
    background:var(--cream);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    color:var(--gold);
}

.staff-info h4{
    margin-bottom:4px;
}

.staff-info p{
    color:var(--muted);
    font-size:13px;
}

.badge{
    padding:6px 12px;
    border-radius:20px;
    color:white;
    font-size:12px;
}

.active{
    background:var(--green);
}

.inactive{
    background:var(--red);
}

.action-btn{
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-size:12px;
}

.btn-active{
    background:var(--green);
}

.btn-inactive{
    background:var(--red);
}

.empty{
    text-align:center;
    padding:80px 20px;
    color:var(--muted);
}

.empty i{
    font-size:42px;
    margin-bottom:12px;
    display:block;
    opacity:.3;
}
/* TOAST MESSAGE */

.toast{
    position:fixed;
    right:30px;
    bottom:30px;
    background:#111;
    color:white;
    padding:14px 20px;
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:99999;
    transform:translateY(100px);
    opacity:0;
    transition:.35s;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

.toast.success{
    border-left:4px solid var(--green);
}

.toast.error{
    border-left:4px solid var(--red);
}

.toast i{
    font-size:20px;
}
</style>
{% endblock %}
{% block content %}
<div class="shell">

    <div class="top-bar">

        <div>

            <div class="eyebrow">Management</div>

            <h1 class="title">Staff List</h1>

        </div>

        <a href="{% url 'create_staff' %}" class="add-btn">

            <i class="ti ti-user-plus"></i>

            Create Staff

        </a>

    </div>

    <!-- FILTER -->
    <div class="filter-bar">

        <div class="search-box">

            <i class="ti ti-search"></i>

            <input
                type="text"
                id="search"
                placeholder="Search name or email"
            >

        </div>

        <select id="status">

            <option value="">All Status</option>

            <option value="active">
                Active
            </option>

            <option value="inactive">
                Inactive
            </option>

        </select>

    </div>

    <!-- TABLE -->
    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>Staff</th>

                    <th>Email</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="staff-body">

            </tbody>

        </table>

    </div>

</div>
<div class="toast" id="toast">

    <i class="ti ti-check" id="toast-icon"></i>

    <span id="toast-msg">
        Success
    </span>

</div>
{% endblock %}
{% block js %}
<script>

function showToast(message, type="success"){

    const toast = $("#toast");

    $("#toast-msg").text(message);

    if(type == "success"){

        $("#toast-icon").attr("class","ti ti-check");

    }else{

        $("#toast-icon").attr("class","ti ti-alert-circle");

    }

    toast.removeClass("success error");

    toast.addClass(type);

    toast.addClass("show");

    setTimeout(function(){

        toast.removeClass("show");

    },3000);

}



function loadStaffs(){

    $.ajax({

        url: "{% url 'filter_staffs' %}",

        data: {

            search: $("#search").val(),

            status: $("#status").val(),

        },

        success: function(response){

            let rows = "";

            if(response.staffs.length > 0){

                response.staffs.forEach(function(staff){

                    rows += `

                    <tr>

                        <td>

                            <div class="staff-box">

                                <div class="avatar">

                                    ${staff.name.substring(0,2).toUpperCase()}

                                </div>

                                <div class="staff-info">

                                    <h4>${staff.name}</h4>

                                    <p>ID : ${staff.id}</p>

                                </div>

                            </div>

                        </td>

                        <td>${staff.email}</td>

                        <td>

                            <span class="badge ${staff.status}">

                                ${staff.status}

                            </span>

                        </td>

                        <td>

                            <button
                                onclick="changeStatus(${staff.id}, '${staff.status}')"
                                class="action-btn ${staff.status == 'active' ? 'btn-inactive' : 'btn-active'}"
                            >

                                ${staff.status == 'active'
                                    ? 'Make Inactive'
                                    : 'Make Active'}

                            </button>

                        </td>

                    </tr>

                    `;

                });

            }else{

                rows = `

                <tr>

                    <td colspan="4" class="empty">

                        <i class="ti ti-users"></i>

                        No Staff Found

                    </td>

                </tr>

                `;

            }

            $("#staff-body").html(rows);

        }

    });

}



function changeStatus(staffId, currentStatus){

    $.ajax({

        url: "/change-staff-status/" + staffId + "/",

        success: function(){

            showToast(

                currentStatus == "active"
                ? "Staff marked as inactive"
                : "Staff marked as active",

                "success"

            );

            loadStaffs();

        },

        error:function(){

            showToast(
                "Something went wrong",
                "error"
            );

        }

    });

}



loadStaffs();



$("#search").keyup(function(){

    loadStaffs();

});



$("#status").change(function(){

    loadStaffs();

});

</script>

{% endblock %}
